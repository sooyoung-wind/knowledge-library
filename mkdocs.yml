site_name: 소소한 지식 저장소
site_url: https://sooyoung-wind.github.io/knowledge-library/
site_description: 소소하지만 오래 남는 가이드, 노트, 레퍼런스를 모아두는 지식 저장소.
copyright: Inspired By Soo.Y

theme:
  name: material
  language: ko
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환
  icon:
    logo: material/leaf-circle
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

nav:
  - Home: index.md
  - 문서:
      - 리서치와 제안:
          - 풍력 MCP 장기보정 AI 모델 종합 리서치 보고서: html/report_wind_mcp_ai_models.html
          - Python Docstring 추천 형식 종합 리서치: html/research_report_python_docstring.html
          - HPC-MI 연구 제안서 초안: html/HPC-MI 연구 제안서 초안.html
      - 가이드와 설계:
          - Grafana 도입 및 실습 계획: html/grafana_minimal_observability_plan.html
          - Hydra + MLflow 실험 추적 아키텍처: html/hydra-mlflow-architecture.html
          - HTML 보고서 디자인 가이드: html/html_report_design_guide.html
          - gstack 설명서 및 시작 가이드: html/gstack-guide.html
      - 템플릿 예시:
          - Minimal Academic: html/example/template-01-minimal.html
          - Dashboard Report: html/example/template-02-dashboard.html
          - Editorial: html/example/template-03-editorial.html
      - 노트와 기록:
          - 내가 하는 바이브코딩: html/내가 하는 바이브코딩.html
          - 브레인크루 플러그인 구조와 운영 방식: html/braincrew_plugin_learning_note.html
          - 하네스 엔지니어링 MeetUp 후기: html/Harness Engineering MeetUp_20260422.html
      - 원문 파일:
          - 시계열 데이터 설명자료 - 기본 PDF: files/시계열 데이터 설명자료 - 기본.pdf
          - 이호연_하네스 엔지니어링 PDF: files/이호연_하네스 엔지니어링.pdf

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
